# MapSim — servidor de licenças. No Portainer: Stacks → Add stack → cola isto.
services:
  mapsim-licencas:
    image: node:22-alpine
    container_name: mapsim-licencas
    restart: unless-stopped
    working_dir: /app
    # descarrega o servidor uma vez para o volume; para actualizar, apaga /data/server.js e reinicia
    command: sh -c "[ -s /data/server.js ] || wget -qO /data/server.js https://raw.githubusercontent.com/NunesDanielPT/MAPSIM-releases/main/server/server.js; exec node /data/server.js"
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: "MUDA-ESTA-PASSWORD-LONGA"
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - mapsim-licencas-data:/data
    ports:
      - "8085:8080"
    networks:
      - networkpi
volumes:
  mapsim-licencas-data:
networks:
  networkpi:
    external: true
