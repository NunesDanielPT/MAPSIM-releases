# MapSim — servidor de licenças. No Portainer: Stacks → Add stack → cola isto.
services:
  mapsim-licencas:
    image: node:22-alpine
    container_name: mapsim-licencas
    restart: unless-stopped
    working_dir: /app
    # ao (re)iniciar descarrega a versão mais recente do servidor; se falhar, usa a que já tem
    command: sh -c "wget -qO /data/server.new.js https://raw.githubusercontent.com/NunesDanielPT/MAPSIM-releases/main/server/server.js && node --check /data/server.new.js && mv /data/server.new.js /data/server.js; exec node /data/server.js"
    environment:
      ADMIN_USER: admin
      ADMIN_PASSWORD: "MUDA-ESTA-PASSWORD-LONGA"
      DATA_DIR: /data
      PORT: 8080
    volumes:
      - mapsim-licencas-data:/data
    ports:
      - "8095:8080"
    networks:
      - networkpi
volumes:
  mapsim-licencas-data:
networks:
  networkpi:
    external: true
